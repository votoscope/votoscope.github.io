<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <style type="text/css">
      @import url("observable:styles/index.css");
      @import url("@fontsource-variable/inter/wght.css");
      @import url("@fontsource-variable/source-serif-4/wght.css");
      @import url("@fontsource-variable/source-serif-4/wght-italic.css");
      @import url("@fontsource-variable/spline-sans-mono/wght.css");
      :root { --theme-background: #ffffff; }
      body { box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: 40px 32px 64px; background: #ffffff; color: #292524; }
      /* Same page width as the rest of the site; the post itself keeps a reading width. */
      main { max-width: 760px; margin: 0; }
      nav.site { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 3rem; font-family: "Inter Variable", system-ui, sans-serif; }
      nav.site .brand { font-family: "Source Serif 4 Variable", Georgia, serif; font-size: 1.35rem; font-weight: 600; color: #1c1917; text-decoration: none; }
      nav.site { align-items: center; }
      nav.site .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
      nav.site ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; margin: 0; padding: 0; font-size: 0.95rem; }
      nav.site ul a { white-space: nowrap; }
      nav.site ul a { text-decoration: none; color: #78716c; }
      nav.site ul a:hover { color: #1c1917; }
      nav.site ul li.language { margin-left: 0.8rem; }
      nav.site ul li.language a { color: #1c1917; font-weight: 500; }
      footer.site { margin-top: 4rem; padding: 1.5rem 1.6rem; background: #f6f5f3; border-radius: 14px; font: 1rem/1.55 "Inter Variable", system-ui, sans-serif; color: #44403c; }
      footer.site p { margin: 0; }
      footer.site a { color: #1c1917; }
      nav.site li.menu { position: relative; }
      nav.site li.menu summary { list-style: none; cursor: pointer; color: #78716c; white-space: nowrap; }
      nav.site li.menu summary::-webkit-details-marker { display: none; }
      nav.site li.menu summary::after { content: ""; display: inline-block; margin-left: 0.4rem; width: 0.38rem; height: 0.38rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-0.2rem) rotate(45deg); }
      nav.site li.menu summary:hover, nav.site li.menu details[open] summary { color: #1c1917; }
      nav.site li.menu ul { position: absolute; z-index: 1000; top: calc(100% + 0.5rem); left: -0.9rem; display: flex; flex-direction: column; gap: 0; min-width: 13rem; padding: 0.4rem 0; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(28, 25, 23, 0.12), 0 0 0 1px rgba(28, 25, 23, 0.06); }
      nav.site li.menu ul a { display: block; padding: 0.45rem 0.9rem; }
      nav.site li.menu ul a:hover { background: #f5f5f4; }
      nav.site li.menu li.separator { border-top: 1px solid #e8e8e8; margin-top: 0.35rem; padding-top: 0.35rem; }
      nav.site .live-dot { display: inline-block; width: 0.45rem; height: 0.45rem; margin-left: 0.4rem; border-radius: 50%; background: #ef4444; vertical-align: 0.1rem; }
      nav.site .live-dot[hidden] { display: none; }
      header.post { margin: 0 0 2rem; }
      header.post h1 { font-family: "Source Serif 4 Variable", Georgia, serif; font-size: clamp(1.9rem, 4.5vw, 2.8rem); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; color: #1c1917; margin: 0 0 0.5rem; }
      header.post .date { font: 0.95rem "Inter Variable", system-ui, sans-serif; color: #6b6560; margin: 0; }
    </style>
  </head>
  <body>
    <nav class="site">
      <a class="brand" href="/en/"><img src="/logo.svg" alt="" width="36" height="36">Votovision</a>
      <ul>
        <li class="menu"><details><summary>Forecasts<span class="live-dot" hidden></span></summary>
          <ul>
            <li><a href="/en/british-columbia/" data-election-date="2026-10-24">British Columbia<span class="live-dot" hidden></span></a></li>
            <li><a href="/en/quebec/" data-election-date="2030-10-07">Quebec<span class="live-dot" hidden></span></a></li>
            <li class="separator"><a href="/en/canada/">Canada</a></li>
          </ul>
        </details></li>
        <li><a href="/en/posts/">Posts</a></li>
        <li><a href="/en/method/">Method</a></li>
        <li><a href="/en/about/">About</a></li>
        <li class="language"><a href="/fr/posts/" hreflang="fr" lang="fr">Français</a></li>
      </ul>
    </nav>
    <main></main>
    <script>
      for (const a of document.querySelectorAll("nav.site a[data-election-date]")) {
        const days = (Date.parse(a.dataset.electionDate) - Date.now()) / 864e5;
        if (days > -1 && days <= 60) { a.querySelector(".live-dot").hidden = false; a.closest("details").querySelector("summary .live-dot").hidden = false; }
      }
      const menus = document.querySelectorAll("nav.site details");
      document.addEventListener("click", (e) => { for (const d of menus) if (!d.contains(e.target)) d.open = false; });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") for (const d of menus) d.open = false; });
    </script>
    <footer class="site">
      <p>Votovision is an independent project, with no partisan affiliation and no sponsor. Open code and data: <a href="https://github.com/votovision">github.com/votovision</a>.</p>
    </footer>
  </body>
</html>
